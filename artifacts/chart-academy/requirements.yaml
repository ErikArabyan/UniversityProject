packages:
  "framer-motion": "Smooth page transitions and component animations"
  "react-simple-code-editor": "Interactive code editor component"
  "prismjs": "Syntax highlighting for the code editor"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility for merging tailwind classes safely"

images:
  - path: "artifacts/chart-academy/public/images/hero-bg.png"
    description: "Dark, abstract, premium geometric background with deep indigo, violet, and subtle cyan gradients, resembling data visualization and code networks"
    aspect_ratio: "16:9"

notes:
  - Fully local frontend, no backend APIs required.
  - Data tracking is stored entirely in localStorage.
  - Live preview uses iframe with srcdoc for secure execution of user-entered code.
